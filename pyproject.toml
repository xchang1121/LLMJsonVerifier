[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-json-verifier"
version = "0.1.0"
description = "Zero-training, candidate-complete classification with Qwen and vLLM"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Xiangyu", email = "cxian008@ucr.edu"}]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "transformers>=4.57,<6",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_json_verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["tokenizer: real Qwen tokenizer, no model weights or GPU"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
