name: CPU validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_tokenizer:
        description: Download and validate pinned tokenizer only (no weights or GPU)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]' -c requirements/gateway-constraints.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m build
      - name: Check Compose configuration without starting containers
        run: docker compose config --quiet
      - name: Validate real tokenizer on CPU
        if: github.event_name == 'workflow_dispatch' && inputs.real_tokenizer && matrix.python == '3.12'
        env:
          LLMJV_TEST_TOKENIZER: "1"
        run: python -m pytest tests/test_real_tokenizer.py -q
